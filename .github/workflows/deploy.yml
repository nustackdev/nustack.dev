# Builds the Next.js site as a static export and deploys it to GitHub Pages.
# Runs on push to main and via manual dispatch from the Actions tab.
#
# Prereqs on the repo (one-time):
#   Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"
#   Settings -> Pages -> Custom domain = nustack.dev (and matching CNAME on DNS)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install
        run: npm ci

      - name: build (static export)
        run: npm run build

      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
